<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plug IoT Dashboard</title>
    
    <!-- Firebase & Chart.js Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .value { font-size: 2.5em; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .btn { padding: 15px 40px; font-size: 1.2em; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; width: 100%; max-width: 300px; font-weight: bold; }
        .btn-on { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); }
        .btn-off { background: var(--danger); color: white; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
        .history-section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ddd; font-size: 1em; margin-bottom: 10px; }
        .kwh-display { font-size: 1.5em; margin: 20px 0; padding: 15px; background: #e8f5e9; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Plug Control Center</h1>

    <!-- Real-time Stats -->
    <div class="grid">
        <div class="card">
            <h3>Live Voltage</h3>
            <div id="v-val" class="value">0.0V</div>
        </div>
        <div class="card">
            <h3>Live Power</h3>
            <div id="p-val" class="value">0.0W</div>
        </div>
        <div class="card">
            <h3>Device Status</h3>
            <button id="relayBtn" class="btn btn-off" onclick="toggleRelay()">LOADING...</button>
        </div>
    </div>

    <!-- History & Energy Report -->
    <div class="history-section">
        <h2>Energy Consumption Report</h2>
        <p>Select a date to view power history and total kWh usage.</p>
        
        <input type="date" id="targetDate">
        <button class="btn btn-on" style="width: auto; padding: 10px 25px;" onclick="getHistory()">Generate Report</button>
        
        <br>
        <div class="kwh-display">
            Total Consumption: <strong id="kwh-val">0.0000</strong> kWh
        </div>

        <canvas id="energyChart" style="width:100%; height:400px;"></canvas>
    </div>
</div>

<script>
    // --- 1. Firebase Configuration ---
    // Replace these with your actual Firebase project settings
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "smart-plug-base.firebaseapp.com",
        databaseURL: "https://smart-plug-base-default-rtdb.firebaseio.com",
        projectId: "smart-plug-base",
        storageBucket: "smart-plug-base.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 2. Real-time Listeners ---
    let relayStatus = false;

    // Listen for Voltage and Power
    db.ref('Readings').on('value', (snap) => {
        const data = snap.val();
        if(data) {
            document.getElementById('v-val').innerText = data.Voltage.toFixed(1) + "V";
            document.getElementById('p-val').innerText = data.Power.toFixed(1) + "W";
        }
    });

    // Listen for Relay State
    db.ref('Controls/Relay').on('value', (snap) => {
        relayStatus = snap.val();
        const btn = document.getElementById('relayBtn');
        btn.innerText = relayStatus ? "SWITCH OFF" : "SWITCH ON";
        btn.className = relayStatus ? "btn btn-off" : "btn btn-on";
    });

    function toggleRelay() {
        db.ref('Controls/Relay').set(!relayStatus);
    }

    // --- 3. History & kWh Logic ---
    const ctx = document.getElementById('energyChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Power Consumption (Watts)', data: [], borderColor: '#27ae60', backgroundColor: 'rgba(39, 174, 96, 0.1)', fill: true, tension: 0.3 }] },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    async function getHistory() {
        const date = document.getElementById('targetDate').value;
        if(!date) return alert("Please select a date first!");

        db.ref('History/' + date).once('value', (snap) => {
            const history = snap.val();
            const times = [];
            const powers = [];
            let totalWattSeconds = 0;

            if(!history) {
                alert("No data recorded for this day.");
                return;
            }

            // Process every 5-second entry
            for(let id in history) {
                times.push(history[id].T);
                powers.push(history[id].P);
                // Each data point represents 5 seconds of usage
                totalWattSeconds += (history[id].P * 5);
            }

            // Calculate kWh: (Total Watt-Seconds / 3600 seconds in an hour) / 1000 to get Kilo
            const kwh = (totalWattSeconds / 3600) / 1000;
            document.getElementById('kwh-val').innerText = kwh.toFixed(5);

            // Update Graph
            myChart.data.labels = times;
            myChart.data.datasets[0].data = powers;
            myChart.update();
        });
    }
</script>

</body>
</html>
