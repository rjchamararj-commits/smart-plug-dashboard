<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Plug Analytics</title>
    
    <!-- External Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { 
            --bg: #f0f3f7; 
            --card: #ffffff; 
            --primary: #1a73e8; 
            --success: #28a745; 
            --danger: #dc3545; 
            --excel: #107c10; 
            --text: #2c3e50; 
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 1100px; margin: auto; }
        
        h1 { 
            text-align: center; 
            font-weight: 500; 
            font-size: 1.5rem; 
            margin-bottom: 20px;
            color: #3c4043;
        }

        /* --- Responsive Grid System --- */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; /* 1 column on mobile */
            gap: 12px; 
            margin-bottom: 20px; 
        }

        /* Desktop View (768px and up) */
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
            .grid-analysis { grid-template-columns: 1fr 2fr !important; }
            h1 { font-size: 2.2rem; }
        }

        .card { 
            background: var(--card); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            text-align: center; 
        }

        .value { font-size: 2.2rem; font-weight: 700; color: var(--primary); margin: 5px 0; }
        .unit { font-size: 1rem; color: #70757a; margin-left: 4px; }
        h3 { margin: 0; font-size: 0.9rem; text-transform: uppercase; color: #5f6368; letter-spacing: 0.5px; }

        /* Buttons */
        .btn { 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            transition: 0.2s; 
            font-size: 1rem;
            margin-top: 5px;
        }
        .btn-on { background: var(--success); color: white; }
        .btn-off { background: var(--danger); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-excel { background: var(--excel); color: white; display: none; }

        /* Form Controls */
        select, input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #dadce0; 
            font-size: 1rem; 
            width: 100%; 
            margin: 8px 0; 
            box-sizing: border-box;
            background: #fff;
        }

        /* Analysis Engine */
        .grid-analysis { display: grid; grid-template-columns: 1fr; gap: 20px; text-align: left; }
        
        .report-stats { 
            background: #e8f0fe; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #d2e3fc; 
            text-align: center; 
        }
        .report-stats b { display: block; font-size: 2rem; color: var(--primary); margin-top: 5px; }

        #chart-wrap { 
            background: white; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            margin-top: 20px; 
            height: 300px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Energy Dashboard</h1>

    <!-- 1. LIVE MONITORING -->
    <div class="grid">
        <div class="card">
            <h3>Voltage</h3>
            <div id="liveV" class="value">0.0<span class="unit">V</span></div>
        </div>
        <div class="card">
            <h3>Current</h3>
            <div id="liveI" class="value">0.000<span class="unit">A</span></div>
        </div>
        <div class="card">
            <h3>Power</h3>
            <div id="liveP" class="value">0.0<span class="unit">W</span></div>
        </div>
        <div class="card">
            <h3>Control</h3>
            <button id="relayBtn" class="btn btn-off" onclick="toggleRelay()">LOADING...</button>
        </div>
    </div>

    <!-- 2. ANALYTICS ENGINE -->
    <div class="card">
        <h2 style="margin:0 0 15px 0; font-size: 1.2rem;">Energy History</h2>
        <div class="grid-analysis">
            <div>
                <label>View Mode</label>
                <select id="mode" onchange="toggleInputs()">
                    <option value="day">Single Day</option>
                    <option value="range">Date Range</option>
                </select>

                <div id="dayBox">
                    <input type="date" id="singleDate">
                </div>

                <div id="rangeBox" style="display:none;">
                    <input type="date" id="startDate">
                    <input type="date" id="endDate">
                </div>

                <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
                <button id="excelBtn" class="btn btn-excel" onclick="downloadExcel()">Download Excel (.xlsx)</button>
            </div>

            <div class="report-stats">
                Total Consumption
                <b id="resKWh">0.0000 kWh</b>
            </div>
        </div>
    </div>

    <!-- 3. CHART -->
    <div id="chart-wrap">
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG (ADD YOUR KEYS HERE) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "https://smart-plug-base-default-rtdb.firebaseio.com",
        projectId: "smart-plug-base",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- LIVE UPDATES ---
    let relayOn = false;
    let currentReportData = [];

    db.ref('Readings').on('value', (snap) => {
        const d = snap.val();
        if(d) {
            document.getElementById('liveV').innerHTML = `${d.Voltage.toFixed(1)}<span class="unit">V</span>`;
            document.getElementById('liveI').innerHTML = `${d.Current.toFixed(3)}<span class="unit">A</span>`;
            document.getElementById('liveP').innerHTML = `${d.Power.toFixed(1)}<span class="unit">W</span>`;
        }
    });

    db.ref('Controls/Relay').on('value', (snap) => {
        relayOn = snap.val();
        const b = document.getElementById('relayBtn');
        b.innerText = relayOn ? "SWITCH OFF" : "SWITCH ON";
        b.className = relayOn ? "btn btn-off" : "btn btn-on";
    });

    function toggleRelay() { db.ref('Controls/Relay').set(!relayOn); }

    function toggleInputs() {
        const m = document.getElementById('mode').value;
        document.getElementById('dayBox').style.display = m === 'day' ? 'block' : 'none';
        document.getElementById('rangeBox').style.display = m === 'range' ? 'block' : 'none';
    }

    // --- CHART ---
    const ctx = document.getElementById('mainChart').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Usage', data: [], borderColor: '#1a73e8', backgroundColor: 'rgba(26, 115, 232, 0.1)', fill: true, tension: 0.3, pointRadius: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // --- GENERATE REPORT ---
    async function generateReport() {
        const mode = document.getElementById('mode').value;
        let totalWS = 0;
        let lbls = [], pts = [];
        currentReportData = [];

        if (mode === 'day') {
            const date = document.getElementById('singleDate').value;
            if(!date) return alert("Select a date!");
            const snap = await db.ref(`History/${date}`).once('value');
            const data = snap.val();
            if(!data) return alert("No data found.");

            for(let k in data) {
                lbls.push(data[k].T);
                pts.push(data[k].P);
                totalWS += (data[k].P * 5); 
                currentReportData.push({ time: data[k].T, val: data[k].P });
            }
        } else {
            let start = new Date(document.getElementById('startDate').value);
            let end = new Date(document.getElementById('endDate').value);
            if(!start || !end) return alert("Select range!");

            while(start <= end) {
                let ds = start.toISOString().split('T')[0];
                const snap = await db.ref(`History/${ds}`).once('value');
                const dData = snap.val();
                let dayWS = 0;
                if(dData) {
                    for(let k in dData) dayWS += (dData[k].P * 5);
                }
                const kwh = ((dayWS/3600)/1000).toFixed(4);
                lbls.push(ds); pts.push(kwh);
                totalWS += dayWS;
                currentReportData.push({ time: ds, val: kwh });
                start.setDate(start.getDate() + 1);
            }
        }

        document.getElementById('resKWh').innerText = ((totalWS/3600)/1000).toFixed(4) + " kWh";
        chart.data.labels = lbls;
        chart.data.datasets[0].data = pts;
        chart.update();
        document.getElementById('excelBtn').style.display = 'block';
    }

    // --- EXCEL ---
    async function downloadExcel() {
        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('Energy Report');
        ws.columns = [{ header: 'Time/Date', key: 'time', width: 20 }, { header: 'Value', key: 'val', width: 15 }];
        currentReportData.forEach(d => ws.addRow(d));
        ws.getCell('D2').value = "Total Consumption:";
        ws.getCell('E2').value = document.getElementById('resKWh').innerText;
        
        const canvas = document.getElementById('mainChart');
        const img = workbook.addImage({ base64: canvas.toDataURL('image/png'), extension: 'png' });
        ws.addImage(img, { tl: { col: 3, row: 4 }, ext: { width: 500, height: 300 } });

        const buffer = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buffer]), `SmartPlug_Report.xlsx`);
    }
</script>
</body>
</html>
